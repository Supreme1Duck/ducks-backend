ktor:
    application:
        modules:
            - com.ducks.ApplicationKt.module
    deployment:
        port: 8080
    database:
      password: "$DB_PASS"
photoroom:
  apiKey: "$PHOTOROOM_API_KEY"
sms:
  token: "$SMS_BY_TOKEN:"
  alphanameId: "$SMS_BY_ALPHANAME_ID:0"
s3:
  endpoint: "$S3_ENDPOINT"
  region: "$S3_REGION"
  bucket: "$S3_BUCKET"
  accessKey: "$S3_ACCESS_KEY"
  secretKey: "$S3_SECRET_KEY"
  publicBaseUrl: "$S3_PUBLIC_BASE_URL"
  publicReadAcl: "$S3_PUBLIC_READ_ACL:false"
jwt:
  domain: "https://jwt-provider-domain/"
  audience: "ducks-audience"
  issuer: "http://localhost"
  realm: "ducks realm"
  secret: "$SECRET"
