<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Скачать приложение</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --surface: #f6f6f7;
  --text: #16161a;
  --muted: #6b6b76;
  --line: #e3e3e8;
  --accent: #d98324;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --surface: #1c1c20;
    --text: #ececf1;
    --muted: #9a9aa5;
    --line: #2c2c33;
    --accent: #f0a95a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 48px 20px calc(48px + env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 420px; margin: 0 auto; text-align: center; }
h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
p { margin: 0 0 28px; color: var(--muted); }
a.store {
  display: block;
  padding: 14px 18px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
}
a.store:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Скачайте приложение</h1>
  <p>Откройте эту страницу на телефоне или выберите магазин вручную.</p>
  <a class="store" href="{{APP_STORE_URL}}">App Store — для iPhone</a>
  <a class="store" href="{{GOOGLE_PLAY_URL}}">Google Play — для Android</a>
</main>
</body>
</html>
